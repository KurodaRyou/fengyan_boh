# 安装到 /etc/systemd/timesyncd.conf.d/60-boh-timesyncd.conf。
# 与 BOH 的 ntp_servers 顺序一致，只配置中国大陆公共 NTP 域名。
# 部署时须在门店网络实测每一项可用。
# 同时关闭经 DHCP / 网口下发的 NTP，让 timesyncd 只用此列表：
# 如在 systemd-networkd 管理网口的 .network 文件中设置 [DHCPv4] UseNTP=no，
# 并关闭其他已启用的网口 NTP 来源。
[Time]
# 清除此前的系统级 NTP 列表，再按下列顺序配置。
NTP=
NTP=ntp.aliyun.com ntp.tencent.com ntp.ntsc.ac.cn cn.pool.ntp.org
