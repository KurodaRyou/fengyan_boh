# 本机开发用，首次启动先初始化：
# cargo run -p boh-server -- init deploy/config.dev.toml
# cargo run -p boh-server -- deploy/config.dev.toml
store_id = "01890a5d-ac96-774b-bcce-b302099a8050"
timezone = "Asia/Shanghai"
business_day_cutoff = "04:00"
# 按顺序核对；init 无有效校时状态时需要能访问其中一个服务器。
# 最后一项 IP 地址用于 DNS 故障时兜底；部署时须在门店网络实测每一项可用。
ntp_servers = ["ntp.aliyun.com", "ntp.tencent.com", "cn.pool.ntp.org", "162.159.200.123"]
db_path = "boh-dev.db"
backup_dir = "boh-dev-backups"
listen_addr = "127.0.0.1:8080"
reader_pool_size = 2
dev_actor_stub = true
