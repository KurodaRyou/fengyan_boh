# 生产环境放在 /etc/boh/config.toml
store_id = "01890a5d-ac96-774b-bcce-b302099a8050"
timezone = "Asia/Shanghai"
business_day_cutoff = "04:00"
# 节点仅核对偏差；系统时钟由 systemd-timesyncd 自动校准。
# 按顺序查询，端口缺省 123；也接受 host:port、[IPv6] 或 [IPv6]:port。
# 只配置域名；部署时须在门店网络实测每一项可用。
ntp_servers = ["ntp.aliyun.com", "ntp.tencent.com", "ntp.ntsc.ac.cn", "cn.pool.ntp.org"]
db_path = "/var/lib/boh/boh.db"
backup_dir = "/var/lib/boh/backups"
listen_addr = "0.0.0.0:8080"
reader_pool_size = 4

# 局域网 HTTPS（docs/tls.md）。随局域网 HTTPS 切片生效：实现之前保持注释，否则配置解析失败。
# 生效后 listen_addr 改为有线网口固定 IP 上的 HTTPS 端口（IP 等于 [tls].ip，不用 0.0.0.0），工作站只经本机回环地址访问：
# listen_addr = "192.168.1.20:8443"
# workstation_addr = "127.0.0.1:8080"   # 只接受回环地址
#
# [tls]
# ip = "192.168.1.20"                   # 部署记录中门店节点的固定 IP
# ca_cert_path = "/run/credentials/boh.service/store-ca.crt"
# ca_key_path = "/run/credentials/boh.service/store-ca.key"
# cert_dir = "/var/lib/boh/tls"         # 叶证书与叶私钥，节点自动签发
