name: Locked paths

# pull_request_target runs this file and the checker from the base branch, so a PR cannot change the check that
# judges it. PR commits are fetched only as Git data: never check them out or execute anything from them here.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  locked-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          scripts/check-locked-paths.sh "$BASE_SHA" "$HEAD_SHA"
