[workspace]
resolver = "3"
members = [
    "crates/boh-domain",
    "crates/boh-storage",
    "crates/boh-app",
    "crates/boh-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
boh-domain = { path = "crates/boh-domain" }
boh-storage = { path = "crates/boh-storage" }
boh-app = { path = "crates/boh-app" }

anyhow = "1"
axum = "0.8"
jiff = { version = "0.2.37", features = ["tzdb-bundle-always"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"

[profile.release]
panic = "abort"
overflow-checks = true
lto = "thin"
codegen-units = 1
